name: JavaScript-release

on:
  push:
    tags:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: |
          cd javascript
          npm install
          npm run build
          npm run types
      - name: Publish
        run: |
          cd javascript
          npm publish --non-interactive --access public
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
